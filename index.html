<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حجز المزارع الفاخرة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        
        header { background: #1e293b; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; }
        .admin-link { background: #3b82f6; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .admin-link:hover { background: #2563eb; }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=80');
            background-size: cover; background-position: center; height: 260px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 0 20px;
        }
        .hero h2 { font-size: 28px; margin-bottom: 8px; }
        .hero p { font-size: 15px; color: #cbd5e1; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .section-title { margin-bottom: 20px; font-size: 22px; color: #1e293b; border-right: 4px solid #10b981; padding-right: 10px; }

        .farms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }
        
        .farm-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; display: flex; flex-direction: column; }

        /* الصورة الرئيسية */
        .main-img-container { width: 100%; height: 190px; overflow: hidden; position: relative; }
        .main-img-container img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }

        /* شارة الحالة */
        .status-badge { position: absolute; top: 12px; left: 12px; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; backdrop-filter: blur(4px); z-index: 10; }
        .status-available { background-color: rgba(16, 185, 129, 0.95); }
        .status-booked { background-color: rgba(239, 68, 68, 0.95); }

        /* معرض الصور المصغرة القابل للسحب */
        .image-gallery { display: flex; gap: 6px; padding: 8px; background: #f1f5f9; overflow-x: auto; }
        .image-gallery img { width: 65px; height: 45px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; flex-shrink: 0; }
        .image-gallery img.active { border-color: #10b981; }

        .farm-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .farm-content h3 { font-size: 19px; color: #1e293b; margin-bottom: 8px; }
        .farm-content p { font-size: 13px; color: #64748b; margin-bottom: 12px; line-height: 1.5; }

        .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-top: 1px solid #f1f5f9; padding-top: 12px; }
        .price { font-weight: bold; color: #10b981; font-size: 16px; }
        
        .book-btn { background-color: #10b981; color: white; border: none; padding: 10px; text-align: center; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; display: block; transition: 0.3s; }
        .book-btn:hover { background-color: #059669; }
        .book-btn.disabled { background-color: #94a3b8; pointer-events: none; }
    </style>
</head>
<body>

    <header>
        <h1>🏡 منصة المزارع</h1>
        <a href="admin.html" class="admin-link">⚙️ لوحة التحكم</a>
    </header>

    <div class="hero">
        <h2>استمتع بأفضل الأوقات في أجمل الاستراحات</h2>
        <p>اختر مزرعتك، تحقق من توفرها، واحجز بكل سهولة</p>
    </div>

    <div class="container">
        <h3 class="section-title">المزارع والاستراحات المتاحة</h3>
        <div class="farms-grid" id="mainFarmsContainer"></div>
    </div>

    <script>
        const defaultFarms = [
            {
                id: 1,
                name: "مزرعة الواحة الخضراء",
                desc: "مساحة واسعة، مسبح مغطى، قاعات مكيفة مجهزة بالكامل.",
                price: "150,000",
                status: "available",
                images: [
                    "https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?auto=format&fit=crop&w=600&q=80",
                    "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=600&q=80",
                    "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600&q=80"
                ]
            },
            {
                id: 2,
                name: "مزرعة النخيل الفاخرة",
                desc: "تصميم حديث، مساحات خضراء شاسعة وإضاءة ليلية مميزة.",
                price: "200,000",
                status: "booked",
                images: [
                    "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=600&q=80",
                    "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=600&q=80"
                ]
            }
        ];

        function loadFarms() {
            let farms = JSON.parse(localStorage.getItem('myFarms')) || defaultFarms;
            let container = document.getElementById('mainFarmsContainer');
            container.innerHTML = '';

            farms.forEach((farm, farmIndex) => {
                let isAvailable = farm.status === 'available';
                let statusText = isAvailable ? 'متوفرة للحجز' : 'محجوزة حالياً';
                let statusClass = isAvailable ? 'status-available' : 'status-booked';
                let btnClass = isAvailable ? 'book-btn' : 'book-btn disabled';
                let btnText = isAvailable ? 'حجز هذه المزرعة' : 'المزرعة محجوزة';

                let mainImg = farm.images && farm.images.length > 0 ? farm.images[0] : '';
                
                let galleryHTML = '';
                if(farm.images) {
                    farm.images.forEach((imgSrc, imgIdx) => {
                        let activeClass = imgIdx === 0 ? 'active' : '';
                        galleryHTML += `<img src="${imgSrc}" class="${activeClass}" onclick="changeCardImage(this, ${farmIndex}, '${imgSrc}')">`;
                    });
                }

                let card = document.createElement('div');
                card.className = 'farm-card';
                card.innerHTML = `
                    <div class="main-img-container">
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        <img src="${mainImg}" id="mainImg_${farmIndex}" alt="${farm.name}">
                    </div>
                    <div class="image-gallery">${galleryHTML}</div>
                    <div class="farm-content">
                        <div>
                            <h3>${farm.name}</h3>
                            <p>${farm.desc}</p>
                        </div>
                        <div>
                            <div class="price-row">
                                <span style="font-size:12px; color:#64748b;">السعر اليومي:</span>
                                <span class="price">${farm.price} د.ع</span>
                            </div>
                            <a href="checkout.html?farm=${encodeURIComponent(farm.name)}&price=${farm.price}" class="${btnClass}">${btnText}</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function changeCardImage(element, farmIndex, imgSrc) {
            document.getElementById(`mainImg_${farmIndex}`).src = imgSrc;
            let gallery = element.parentElement;
            gallery.querySelectorAll('img').forEach(img => img.classList.remove('active'));
            element.classList.add('active');
        }

        window.onload = loadFarms;
    </script>
</body>
</html>
